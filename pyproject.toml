[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rob3_ucsim"
version = "0.1.0"
description = "ROB3-specific ucSim simulation harness (built on pyucsim): drive the ROB3 8031 firmware in µCsim and read back its state"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrei Kholodnyi" }]
keywords = ["rob3", "eurobtec", "ucsim", "pyucsim", "8031", "mcs-51", "simulator", "robot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Emulators",
]
# The generic ucSim-over-pty transport comes from pyucsim (git-only; not on
# PyPI). rob3_ucsim adds only the ROB3-specific layer on top.
dependencies = [
    "pyucsim @ git+https://github.com/eurobtec/pyucsim.git",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
viz = ["pybullet>=3.2"]

[project.scripts]
rob3-viz = "rob3_ucsim.frontends:main"
rob3-teachbox = "rob3_ucsim.inputs.teachbox:main"

[project.urls]
Homepage = "https://github.com/eurobtec/rob3_ucsim"
"Firmware repo" = "https://github.com/eurobtec/rob3"
"Protocol library" = "https://github.com/eurobtec/rob3_py"
"ucSim client" = "https://github.com/eurobtec/pyucsim"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rob3_ucsim = ["urdf/*.urdf", "urdf/*.xacro", "urdf/meshes/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
